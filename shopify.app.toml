# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "de9123bc62cdaad408b0075187582b2a"
name = "widget-whatsapp"
application_url = "https://whatsapp-widget-app.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = ""

[auth]
redirect_urls = [ "https://whatsapp-widget-app.vercel.app/api/auth/callback" ]

[app_navigation]
name = "Dashboard"
url = "/app"

  [[app_navigation.subnav]]
  name = "Privacy Policy"
  url = "/app/legal/privacy-policy"

  [[app_navigation.subnav]]
  name = "Terms of Service"
  url = "/app/legal/terms-of-service"

  [[app_navigation.subnav]]
  name = "Refund Policy"
  url = "/app/legal/refund-policy"

  [[app_navigation.subnav]]
  name = "Support"
  url = "/app/legal/support"